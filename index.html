<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow,noarchive"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Universal Team Intake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a one-column worksheet. A sticky header holds the progress bar, the
   Core / All switch and the section strip. Questions sit open on the page
   ground. Answers are full-width tap rows with a mark box at the leading edge,
   so the same layout reads left-to-right and right-to-left. */
:root {
  --ground: #F1F3F7;      /* cool paper */
  --surface: #FFFFFF;     /* things you can tap or type in */
  --ink: #141B27;
  --ink-2: #535F76;
  --rule: #D2D8E2;
  --accent: #1D4F91;      /* a ticked answer */
  --on-accent: #FFFFFF;
  --accent-wash: #DCE7F6;
  --no: #A23629;          /* "does not fit", "never", and the Protected level */
  --no-wash: #F7E2DE;
  --pre: #76590A;         /* already filled in, and the Mixed level */
  --pre-wash: #F4EBCD;
  --open: #1B6A48;        /* the Open level */
  --open-wash: #DBEEE4;
  --display: "Rubik", "Segoe UI", "Helvetica Neue", "Noto Sans Arabic", "Noto Sans Hebrew", Arial, sans-serif;
  --body: "Noto Sans", "Segoe UI", "Helvetica Neue", "Noto Sans Arabic", "Noto Sans Hebrew", Arial, sans-serif;
  --r: 7px;
  --col: 720px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E1219; --surface: #171D27; --ink: #E6EAF1; --ink-2: #9BA6B9; --rule: #2A3341;
    --accent: #82B2F1; --on-accent: #06172E; --accent-wash: #14263F;
    --no: #EE9486; --no-wash: #3A1E1A; --pre: #DEBC5C; --pre-wash: #30270F;
    --open: #72CDA0; --open-wash: #11301F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0E1219; --surface: #171D27; --ink: #E6EAF1; --ink-2: #9BA6B9; --rule: #2A3341;
  --accent: #82B2F1; --on-accent: #06172E; --accent-wash: #14263F;
  --no: #EE9486; --no-wash: #3A1E1A; --pre: #DEBC5C; --pre-wash: #30270F;
  --open: #72CDA0; --open-wash: #11301F;
  color-scheme: dark;
}

body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- header ---- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); border-bottom: 1px solid var(--rule); }
.top-in { max-width: var(--col); margin-inline: auto; box-sizing: border-box; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 8px; display: grid; gap: 8px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.top-row > .brand { min-width: 0; }
.brand { font: 600 0.9375rem/1.2 var(--display); }
.count { font-size: 0.8125rem; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.count-row { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; margin-top: -2px; }
.jump { font: 500 0.8125rem/1.3 var(--display); color: var(--accent); background: none; border: 0; padding: 4px 0; margin: -4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
.lvl { font: 500 0.75rem/1 var(--display); padding: 4px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.lvl[data-l="open"] { background: var(--open-wash); color: var(--open); border-color: transparent; }
.lvl[data-l="mixed"] { background: var(--pre-wash); color: var(--pre); border-color: transparent; }
.lvl[data-l="protected"] { background: var(--no-wash); color: var(--no); border-color: transparent; }
.top-tools { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
.seg2 { display: flex; flex: 0 0 auto; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg2 button { font: 500 0.8125rem/1 var(--display); padding: 9px 12px; min-height: 34px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg2 button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.bar { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: 0 0 auto; min-width: 34px; height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); font: 500 0.875rem/1 var(--display); font-variant-numeric: tabular-nums; cursor: pointer; }
.strip button.is-done { background: var(--accent-wash); border-color: transparent; color: var(--accent); }
.strip button[aria-current="step"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }

/* ---- page ---- */
main { max-width: var(--col); margin-inline: auto; box-sizing: border-box; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 56px; display: grid; gap: 28px; outline: 0; }
main > * { min-width: 0; }
.sec-head h1 { font: 600 1.625rem/1.2 var(--display); margin: 0; text-wrap: balance; }
.eyebrow { font: 500 0.8125rem/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; font-variant-numeric: tabular-nums; }
.intro { margin: 10px 0 0; color: var(--ink-2); max-width: 60ch; }
.warn { margin: 0; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--no); background: var(--no-wash); color: var(--ink); font-size: 0.9375rem; }

.how { border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
.how summary { cursor: pointer; padding: 12px 14px; font: 600 1rem/1.3 var(--display); list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.how summary::-webkit-details-marker { display: none; }
.how summary::after { content: "+"; font-weight: 400; font-size: 1.25rem; line-height: 1; color: var(--ink-2); }
.how[open] summary::after { content: "\2212"; }
.how-body { padding: 0 14px 14px; display: grid; gap: 14px; }
.how-body p { margin: 0; color: var(--ink-2); font-size: 0.9375rem; max-width: 62ch; }
.how-body p.say { color: var(--ink); }
.how-body h3 { margin: 4px 0 0; font: 600 0.9375rem/1.3 var(--display); }
.how ul, .how ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.how li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; font-size: 0.9375rem; }
.mark { width: 22px; height: 22px; box-sizing: border-box; border-radius: 5px; display: grid; place-items: center; font: 600 0.8125rem/1 var(--display); }
.mark.tick { background: var(--accent); color: var(--on-accent); }
.mark.cross { border: 1.5px solid var(--no); color: var(--no); }
.mark.fill { background: var(--pre-wash); color: var(--pre); }
.mark.line { border-bottom: 2px solid var(--ink-2); border-radius: 0; height: 16px; }
.mark.num { border: 1.5px solid var(--ink-2); color: var(--ink-2); }
.mark.star { color: var(--accent); font-size: 1rem; }

/* ---- a question ---- */
.fields { display: grid; gap: 32px; }
.field { display: grid; gap: 10px; scroll-margin-top: 170px; min-width: 0; }
.group { margin: 0; padding-block-start: 22px; border-top: 1px solid var(--rule); font: 600 1.1875rem/1.3 var(--display); text-wrap: balance; }
.fields > .field:first-child .group { padding-block-start: 0; border-top: 0; }
.group-hint { margin: -2px 0 8px; color: var(--ink-2); font-size: 0.9375rem; max-width: 62ch; }
.f-head { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.f-num { font: 500 0.8125rem/1.3 var(--display); color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 2.2em; white-space: nowrap; }
.f-num .star { color: var(--accent); margin-inline-end: 3px; }
.f-label { font: 600 1.0625rem/1.3 var(--display); margin: 0; text-wrap: balance; }
.f-hint { margin: 0; color: var(--ink-2); font-size: 0.9375rem; max-width: 62ch; }
.f-msg { margin: 0; color: var(--no); font-size: 0.875rem; }
.f-msg:empty { display: none; }
.tag { justify-self: start; margin: 0; font: 500 0.75rem/1.3 var(--display); padding: 4px 8px; border-radius: 4px; background: var(--ground); border: 1px solid var(--rule); color: var(--ink-2); }
.tag.ev { background: var(--accent-wash); border-color: transparent; color: var(--accent); }
.part { display: grid; gap: 8px; min-width: 0; }
.p-prompt { margin: 6px 0 0; font-weight: 600; font-size: 0.9375rem; line-height: 1.35; }
.p-mode { margin: 0; font: 500 0.75rem/1.35 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.p-mode.is-pre { color: var(--pre); }
[dir="rtl"] .p-mode, [dir="rtl"] .eyebrow { letter-spacing: 0; }
.note { margin: 0; padding: 10px 12px; border-radius: var(--r); background: var(--pre-wash); font-size: 0.9375rem; max-width: 66ch; }
.note[data-l="open"] { background: var(--open-wash); }
.note[data-l="protected"] { background: var(--no-wash); }
.note[data-l="plain"] { background: var(--accent-wash); }
.note b { font-weight: 600; }

.opts { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: stretch; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; text-align: start; width: 100%; box-sizing: border-box; padding: 10px 12px; min-height: 44px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); color: var(--ink); line-height: 1.4; cursor: pointer; }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.box { width: 22px; height: 22px; box-sizing: border-box; margin-top: 1px; border: 1.5px solid var(--ink-2); border-radius: 5px; display: grid; place-items: center; font: 600 0.8125rem/1 var(--display); color: transparent; font-variant-numeric: tabular-nums; }
.opt.is-on { border-color: var(--accent); background: var(--accent-wash); }
.opt.is-on .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.is-off { background: transparent; color: var(--ink-2); }
.opt.is-off .txt { text-decoration: line-through; }
.opt.is-off .box { border-color: var(--no); color: var(--no); }
.x { width: 44px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); color: var(--ink-2); font: 500 0.9375rem/1 var(--display); cursor: pointer; }
.x[aria-pressed="true"] { background: var(--no-wash); border-color: var(--no); color: var(--no); }

.opts.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 9px 14px; min-height: 40px; box-sizing: border-box; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 0.9375rem; line-height: 1.2; cursor: pointer; text-align: start; }
.chip.is-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.nyrow { display: flex; flex-wrap: wrap; gap: 8px; }
.nyrow .chip { font-size: 0.8125rem; padding: 6px 12px; min-height: 34px; color: var(--ink-2); }
.nyrow .chip.is-on { background: var(--pre-wash); border-color: var(--pre); color: var(--pre); }

.a-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding-block: 8px; padding-inline: 12px 8px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
.a-row .txt { min-width: 0; overflow-wrap: anywhere; line-height: 1.4; }
.seg { display: flex; flex: 0 0 auto; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.seg button { padding: 8px 12px; min-height: 36px; border: 0; background: transparent; color: var(--ink-2); font: 500 0.8125rem/1.1 var(--display); cursor: pointer; }
.seg button.n[aria-pressed="true"] { background: var(--no-wash); color: var(--no); }
.seg button.m[aria-pressed="true"] { background: var(--pre-wash); color: var(--pre); }
.seg button.y[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); }

.in, .ta { width: 100%; box-sizing: border-box; font: 400 1rem/1.45 var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; margin: 0; }
select.in { min-height: 46px; }
.ta { min-height: 6.5em; resize: vertical; display: block; }
.in::placeholder, .ta::placeholder { color: var(--ink-2); opacity: .8; font-style: italic; }
.other { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.other .in { flex: 1 1 12em; width: auto; }
.other label { font-size: 0.875rem; color: var(--ink-2); }
.wc { margin: 0; font-size: 0.8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wc.is-over { color: var(--no); }

/* a short list of named lines, each with one answer */
.rws { display: grid; gap: 8px; }
.rw { display: grid; grid-template-columns: minmax(7em, 12em) 1fr; gap: 10px; align-items: center; }
.rw label { font-size: 0.9375rem; font-weight: 600; line-height: 1.3; }

/* cards a team adds one by one: a roster, a list of channels */
.cards { display: grid; gap: 10px; }
.card { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card-t { font: 600 0.9375rem/1.2 var(--display); }
.card-g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.cf { display: grid; gap: 4px; min-width: 0; align-content: start; }
.cf.wide { grid-column: 1 / -1; }
.cf label { font-size: 0.8125rem; color: var(--ink-2); line-height: 1.3; }
.card .in { background: var(--ground); }
.lnk { background: none; border: 0; color: var(--ink-2); font-size: 0.8125rem; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 6px 4px; margin: -6px -4px; }
.cards > .btn { justify-self: start; }

.codebox .how-body { padding-top: 14px; }
.codebox .in { flex: 1 1 10em; width: auto; text-transform: uppercase; }
.codebox label { font: 600 1rem/1.3 var(--display); }
.miss { display: grid; gap: 8px; padding-block-start: 22px; border-top: 1px solid var(--rule); }
.miss label { font: 600 1rem/1.3 var(--display); }
.miss p { margin: 0; color: var(--ink-2); font-size: 0.875rem; }
.miss .ta { min-height: 4.5em; }
.more { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding-block-start: 22px; border-top: 1px solid var(--rule); }
.more p { margin: 0; flex: 1 1 16em; color: var(--ink-2); font-size: 0.9375rem; }

.nav { display: flex; justify-content: space-between; gap: 12px; }
.btn { font: 500 1rem/1.2 var(--display); padding: 12px 18px; min-height: 46px; box-sizing: border-box; border-radius: var(--r); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { border-color: var(--no); color: var(--no); }
.btn.small { font-size: 0.875rem; padding: 8px 12px; min-height: 38px; }
.filebtn { position: relative; }
.filebtn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- finish ---- */
.block { display: grid; gap: 10px; min-width: 0; }
.block h2 { font: 600 1.125rem/1.3 var(--display); margin: 0; }
.block > p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.left-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.left-list .chip { font-size: 0.8125rem; padding: 6px 11px; min-height: 34px; }
.ok-line { color: var(--accent); font-weight: 600; }
.doc { min-height: 22em; font-size: 0.875rem; line-height: 1.55; }
.notes { min-height: 6em; font-size: 0.875rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { font-size: 0.875rem; color: var(--ink-2); }
.steps { margin: 0; padding-inline-start: 1.3em; display: grid; gap: 6px; max-width: 62ch; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--no); border-radius: var(--r); background: var(--no-wash); }
.confirm span { flex: 1 1 14em; }
.keep { display: grid; gap: 8px; padding-block-start: 18px; border-top: 1px solid var(--rule); scroll-margin-top: 170px; }
.keep h2 { font: 600 1.0625rem/1.3 var(--display); margin: 0; }
.keep p { margin: 0; color: var(--ink-2); font-size: 0.875rem; max-width: 62ch; }
.keep .caution { color: var(--ink); }
.okmsg { margin: 0; padding: 10px 12px; border-radius: var(--r); background: var(--accent-wash); color: var(--ink); font-size: 0.9375rem; }
.sum { min-height: 10em; max-height: 18em; font-size: 0.8125rem; line-height: 1.5; }
.paste { min-height: 4.5em; font-size: 0.875rem; }

@media (max-width: 480px) {
  .a-row { grid-template-columns: 1fr; padding-inline: 12px; }
  .seg { justify-self: start; }
  .rw { grid-template-columns: 1fr; gap: 4px; }
  .card-g { grid-template-columns: 1fr; }
  .sec-head h1 { font-size: 1.4375rem; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

/* ---- paper form: printed from a saved copy of this page ---- */
#paper { display: none; }
@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --ground: #FFFFFF; --surface: #FFFFFF; --ink: #000000; --ink-2: #333333; --rule: #888888;
    --accent: #000000; --on-accent: #FFFFFF; --accent-wash: #FFFFFF; --no: #000000; --no-wash: #FFFFFF; --pre: #000000; --pre-wash: #FFFFFF;
    --open: #000000; --open-wash: #FFFFFF;
    color-scheme: light;
  }
  @page { margin: 14mm; }
  body::before, .top, main { display: none !important; }
  #paper { display: block; font: 400 9.5pt/1.3 var(--body); color: var(--ink); }
  .pp-title { font: 600 17pt/1.2 var(--display); margin: 0 0 4pt; }
  .pp-lead { margin: 0 0 6pt; font-size: 9.5pt; color: var(--ink-2); }
  .pp-sec > h2 { font: 600 13pt/1.2 var(--display); margin: 16pt 0 8pt; padding-bottom: 3pt; border-bottom: 1pt solid var(--ink); break-after: avoid; }
  .pp-group { font: 600 11pt/1.3 var(--display); margin: 10pt 0 4pt; break-after: avoid; }
  .pp-field { margin: 0 0 9pt; }
  .pp-field h3 { font: 600 10.5pt/1.3 var(--display); margin: 0 0 2pt; break-after: avoid; }
  .pp-hint, .pp-prompt, .pp-mode { break-after: avoid; }
  .pp-table tr, .ln { break-inside: avoid; }
  .pp-hint { margin: 0 0 3pt; font-size: 9pt; color: var(--ink-2); }
  .pp-prompt { margin: 5pt 0 2pt; font-weight: 600; }
  .pp-mode { margin: 0 0 2pt; font-size: 8.5pt; color: var(--ink-2); }
  .pp-opts { columns: 2; column-gap: 18pt; margin: 2pt 0 0; padding: 0; list-style: none; }
  .pp-opts.one { columns: 1; }
  .pp-opts li { break-inside: avoid; margin: 0 0 2.5pt; padding-inline-start: 17pt; text-indent: -17pt; }
  .sq { display: inline-block; width: 9pt; height: 9pt; box-sizing: border-box; border: .9pt solid var(--ink); margin-inline-end: 8pt; vertical-align: -1pt; text-indent: 0; }
  .rk { display: inline-block; width: 11pt; border-bottom: .9pt solid var(--ink); margin-inline-end: 6pt; text-indent: 0; }
  .ln { height: 17pt; border-bottom: .75pt solid var(--rule); }
  .blank { display: inline-block; width: 60%; border-bottom: .75pt solid var(--rule); }
  .pp-table { width: 100%; border-collapse: collapse; margin: 3pt 0 0; table-layout: fixed; }
  .pp-table th, .pp-table td { border-bottom: .5pt solid var(--rule); padding: 2.5pt 4pt; text-align: start; vertical-align: top; font-weight: 400; overflow-wrap: anywhere; }
  .pp-table th { font-size: 8pt; color: var(--ink-2); }
  .pp-table td.tall { height: 20pt; }
  .pp-table .c { width: 14%; text-align: center; white-space: nowrap; }
  .pp-table.grid th, .pp-table.grid td { border: .5pt solid var(--rule); }
}
</style>

<script>
/* ==========================================================================
   QUESTION LIST, part 1 of 3 (Start here, and sections 1 to 4)

   Everything a team reads lives in these lists, not in the page code.
   To prepare the form for a region, change the lists and keep the code.

   Each field has an id, a label, and one or more parts. A part is one of:
     text    one short line            long    a few sentences
     pick    tap what fits (max: 1, 2, 3; no max means any number)
             pre: [..] ticks options before the team starts
             cross: 0 shows the "does not fit" button on each line
     rank    tap in order (top: how many to number)
     allow   each line is "Never" or "OK for us"
     rows    a short list of named lines, each with one written answer
     cards   cards the team adds one by one (a roster, a list of channels)
     note    a line of text with nothing to answer
   hideAt: [..] on a part or a card box leaves it out at those openness levels.
   ph is a grey example. It is never saved as an answer.

   Field settings:
     core: true         a starred question, part of the short core set
     levels: [..]       only asked at these openness levels (see A5)
     fromStage: n       "not yet" for teams before stage n (see C1; 0 is the first)
     ny: true           shows the "Not yet" and "We don't know" buttons
     hintBy: {..}       a hint that changes with the team's openness level
     group / groupHint  a heading above this field

   LISTS THAT CHANGE BY REGION are marked REGION below. The ones here are
   general drafts. Build the real ones with people who work in that setting.
   Add new options at the END of a list, so saved answers keep their place.

   LANGUAGES: the form text is English. A language is one entry in
   FORM.packs (see pack-ru.js) with its name, direction, and a table that
   maps each English line to the translated line. Lines with no translation
   stay in English. A language shows up only when a block of the event code
   lists it (langs: ['ru', 'he']), so each event offers its own languages.

   SAVED ANSWERS AND LATER VERSIONS: answers are saved as choice numbers,
   so a new choice at the END of a list never breaks a saved file. If a
   list is reordered, a choice removed, or a question renumbered, give the
   form a new id and add the old id to FORM.older with a step that says
   what moved. The form then reads old summaries and files on its own:
     older: { 'universal-2026-11-19c': { to: 'the-new-id',
       ids:  { '9.6': '9.7', '10.9': null },          renumbered, or removed (null)
       opts: { '3.5#0': [0, 2, 1, -1] },               where each old choice sits now (-1: gone)
       rows: { '6.2#0': [0, 1, 3, 2] },                the same, for named lines
       cols: { '10.1#0': { 1: [0, 1, 2] } },           the same, for a pull-down in a card

   ========================================================================== */

  /* ---------------------------------------------------------------- 3 */
  add({ n: 3, title: `Who we are trying to reach`,

<script>

    "Event code": "Код мероприятия",
    "If you were given a code for a summit or event, enter it here. It adds the choices made for that event. No code? Skip this.": "Если вам дали код саммита или мероприятия, введите его здесь. Он добавит варианты ответов, подготовленные для этого мероприятия. Нет кода? Пропустите.",
    "Use this code": "Применить код",
    "Remove the code": "Убрать код",
    "We don't know that code. Check it and try again, or carry on without one.": "Мы не знаем такого кода. Проверьте его и попробуйте ещё раз или продолжайте без кода.",
    "We don't know the code \"{x}\". The form is still using {c}. To stop using it, tap \"Remove the code\".": "Мы не знаем кода «{x}». Анкета по-прежнему использует код {c}. Чтобы отключить его, нажмите «Убрать код».",
    "Code added. The form now shows the choices made for this event, and {n} answers are filled in for you.": "Код добавлен. Теперь анкета показывает варианты для этого мероприятия. Ответов, заполненных за вас: {n}.",
    "Added question from your event code.": "Этот вопрос добавлен кодом мероприятия.",
    "Choices changed by your event code.": "Варианты изменены кодом мероприятия.",
    "Filled in from your event code. Change it if it is wrong.": "Заполнено по коду мероприятия. Исправьте, если это неверно.",
    "Filled in for you: {l}. Every other question now shows the choices made for this event.": "За вас заполнено: {l}. Во всех остальных вопросах теперь показаны варианты для этого мероприятия.",
    "Code removed. The form shows the general choices.": "Код убран. Анкета показывает общие варианты.",
    "This form is using the code {n}, saved in this browser. Place: {p}. Attendees: {t}. Audience: {a}.": "Анкета использует код {n}, он сохранён в этом браузере. Место: {p}. Участники: {t}. Аудитория: {a}.",
    "Adding or removing a code clears your answers to the questions it changes.": "Если добавить или убрать код, ваши ответы на вопросы, которые он меняет, будут стёрты.",
    "Event code: {n} (place: {p}; attendees: {t}; audience: {a})": "Код мероприятия: {n} (место: {p}; участники: {t}; аудитория: {a})",
    "Read this first": "Сначала прочитайте",
    "The more real detail you give, the more exact the help. With names, roles, and links, your Teammate can say:": "Чем больше настоящих деталей вы дадите, тем точнее будет помощь. Если есть имена, роли и ссылки, ваш AI Teammate может сказать:",
    "\"Send this ad to Sally on the web team to post on our Facebook page, and tell Bill to watch Telegram for replies.\"": "«Отправьте эту рекламу Салли из веб-команды, пусть опубликует на нашей странице в Facebook, и скажите Биллу следить за ответами в Telegram».",
    "With stand-ins, it can only say: \"Send this to your web person.\" How much detail is safe depends on your team. Step A helps you choose your level in about a minute.": "С условными обозначениями он может сказать только: «Отправьте это тому, кто ведёт ваш сайт». Сколько деталей безопасно давать, зависит от вашей команды. Шаг A поможет выбрать уровень примерно за минуту.",
    "A simple test for any detail": "Простая проверка для любой детали",
    "Does the Teammate need it to help us? If not, skip it.": "Нужно ли это AI Teammate, чтобы помогать нам? Если нет, пропустите.",
    "Is it already public? If it is on our website or our sign, write it down. That adds no risk.": "Это уже известно всем? Если это есть на нашем сайте или на вывеске, пишите. Риска это не добавляет.",
    "If this file got out, could it hurt someone? If no, write it down. If yes, use a role or an alias for that one detail.": "Если этот файл попадёт в чужие руки, может ли это кому-то навредить? Если нет, пишите. Если да, замените эту одну деталь ролью или псевдонимом.",
    "Starred questions are the core. They are enough to get your Teammate working.": "Вопросы со звёздочкой основные. Их достаточно, чтобы ваш AI Teammate начал работать.",
    "Tap what fits. Where it says \"up to 3\", pick only 3. Picking everything tells your Teammate nothing.": "Нажимайте на то, что подходит. Где написано «до 3», выберите только 3. Если выбрать всё, AI Teammate ничего не узнает.",
    "Tap ✕ on anything that clearly does not fit. It tells your Teammate what to stay away from.": "Нажмите ✕ на том, что явно не подходит. Так AI Teammate узнает, чего избегать.",
    "Grey examples are hints. They are never saved. Write your own answer in their place.": "Серые примеры только подсказки. Они не сохраняются. Напишите на их месте свой ответ.",
    "\"Not yet\" and \"We don't know\" are real answers. They tell your Teammate where to coach you.": "«Пока нет» и «Мы не знаем» тоже настоящие ответы. Они показывают AI Teammate, где вам нужна помощь.",
    "Use real words from real people. A sentence someone said to you last month is worth more than a polished summary.": "Пишите настоящие слова настоящих людей. Фраза, которую вам сказали в прошлом месяце, ценнее гладкого пересказа.",
    "Your answers stay on this device. This page does not send them anywhere. At the end you get your Brand Document to copy or save.": "Ваши ответы остаются на этом устройстве. Эта страница никуда их не отправляет. В конце вы получите бренд-документ, который можно скопировать или сохранить.",
    "Protected teams: if you can, fill this in from an offline copy of this page, on a device your team controls.": "Командам с уровнем «Защищённый»: если можете, заполняйте анкету в офлайн-копии этой страницы на устройстве, которое контролирует ваша команда.",
    "This browser is not saving your answers. Copy your summary or save a progress file before you close the page.": "Этот браузер не сохраняет ваши ответы. Скопируйте сводку или сохраните файл с ответами, прежде чем закрыть страницу.",
    "If you lead more than one team": "Если вы ведёте несколько команд",
    "Fill in the form once. Copy your summary. Then open the form fresh for the next team, paste the summary in, and change only what differs. The shared parts are usually 1.3, 6.8 to 6.10, 7.5, and 9.7.": "Заполните анкету один раз. Скопируйте сводку. Потом откройте анкету заново для следующей команды, вставьте сводку и измените только то, что отличается. Общими обычно бывают 1.3, с 6.8 по 6.10, 7.5 и 9.7.",
    "Tap ✕ on any that clearly do not fit": "Нажмите ✕ на том, что явно не подходит",
    "Already filled in. Change it if it is wrong.": "Уже заполнено. Исправьте, если это неверно.",
    "Fill in the lines you can": "Заполните строки, которые можете",
    "Only some": "Только некоторые",
    "Choose": "Выберите",
    "Remove": "Удалить",
    "That is the most this list holds.": "Больше в этот список не помещается.",
    "Not yet": "Пока нет",
    "We don't know": "Мы не знаем",
    "{n} of {m} words": "Слов: {n} из {m}",
    "Optional at the {l} level": "Необязательно на уровне «{l}»",
    "Not yet at your stage. Answer only if you already have this.": "Пока не для вашего этапа. Отвечайте, только если это у вас уже есть.",
    "{n} more questions in this section add detail.": "Ещё вопросов в этом разделе, которые добавляют детали: {n}.",
    "This section has no core questions.": "В этом разделе нет основных вопросов.",
    "Show all questions": "Показать все вопросы",
    "Answer A1 to A4 and this form will suggest a level. You decide.": "Ответьте на вопросы с A1 по A4, и анкета предложит уровень. Решаете вы.",
    "From your four answers, this form suggests: {l}. You decide.": "По вашим четырём ответам анкета предлагает уровень: {l}. Решаете вы.",
    "You picked a more open level than your answers suggest. That is your call. If your team is not sure, start with the more careful level.": "Вы выбрали более открытый уровень, чем подсказывают ваши ответы. Это ваше решение. Если команда не уверена, начните с более осторожного уровня.",
    "Open means: write real names, addresses, links, and phone numbers. List your roster with full names, roles, and contact details. Section 5 is short for you. Keep your finished document wherever your team works, and share it as you choose.": "«Открытый» значит: пишите настоящие имена, адреса, ссылки и телефоны. В списке команды укажите полные имена, роли и контакты. Раздел 5 для вас короткий. Храните готовый документ там, где работает ваша команда, и делитесь им как считаете нужным.",
    "Mixed means: write what is already public. List your roster with first names or aliases, plus roles. Use only public links and phone numbers. Keep your finished document where only your team can open it.": "«Смешанный» значит: пишите то, что уже известно всем. В списке команды укажите имена без фамилий или псевдонимы и роли. Давайте только общедоступные ссылки и телефоны. Храните готовый документ там, где его может открыть только ваша команда.",
    "Protected means: use stand-ins (\"our city\") for names, places, and links. List your roster by role only, with no phone numbers. Fill in all of Section 5. Keep your finished document on a device or account only your team controls. Do not send it back to the person who built your Teammate, and do not share it with other teams.": "«Защищённый» значит: вместо имён, мест и ссылок пишите условные обозначения («наш город»). В списке команды укажите только роли, без телефонов. Заполните весь раздел 5. Храните готовый документ на устройстве или в аккаунте, которые контролирует только ваша команда. Не отправляйте его тому, кто настраивал ваш AI Teammate, и не делитесь им с другими командами.",
    "How much of this section you fill in depends on your level. Pick your level in Start here. Until then, the form shows every question.": "Сколько вопросов этого раздела заполнять, зависит от вашего уровня. Выберите уровень на странице «Начните здесь». До тех пор анкета показывает все вопросы.",
    "Your level is Open. Answer 5.1 and 5.6. Everything is allowed unless you mark it. The other questions here are optional for you.": "Ваш уровень: Открытый. Ответьте на 5.1 и 5.6. Разрешено всё, что вы не отметили. Остальные вопросы здесь для вас необязательны.",
    "Your level is Mixed. Answer everything here. Where you leave a line unmarked, your Teammate will ask you first.": "Ваш уровень: Смешанный. Ответьте здесь на всё. Если строка осталась без отметки, AI Teammate сначала спросит вас.",
    "Your level is Protected. Answer everything. Anything you leave blank is treated as \"never\". That is the safe way to fail.": "Ваш уровень: Защищённый. Ответьте на всё. Всё, что осталось пустым, считается «никогда». Так ошибка будет в безопасную сторону.",
    "No one has replied to your content yet, so answer 8.3 and leave the rest. Your Teammate will help you build this.": "На ваш контент пока никто не ответил, поэтому ответьте на 8.3, а остальное оставьте. AI Teammate поможет вам это выстроить.",
    "If a step is not in place yet, tap \"Not yet\". Your Teammate will help you build it.": "Если какого-то шага ещё нет, нажмите «Пока нет». AI Teammate поможет его выстроить.",
    "You have no channel yet, so some questions here are marked \"not yet\". Answer what you can.": "У вас пока нет канала, поэтому часть вопросов здесь помечена «пока нет». Ответьте на то, на что можете.",
    "Your top worries from question #3.5:": "Ваши главные тревоги из вопроса №3.5:",
    "You have not ranked the worries in question #3.5 yet.": "Вы ещё не расставили по порядку тревоги в вопросе №3.5.",
    "Every answer you gave is in the text below. Questions you skipped are listed, so your Teammate asks before it guesses.": "Все ваши ответы собраны в тексте ниже. Пропущенные вопросы перечислены, чтобы AI Teammate спрашивал, а не угадывал.",
    "Core answered": "На основные вопросы отвечено",
    "You are seeing the core questions. {n} more questions add detail, such as your roster and your channels.": "Вы видите основные вопросы. Ещё вопросов, которые добавляют детали, например список команды и каналы: {n}.",
    "Save it where your level says.": "Сохраните его там, где положено для вашего уровня.",
    "If you have a logo, upload the image file to your AI Teammate in the same place you upload this document, so it can see your logo.": "Если у вас есть логотип, загрузите файл с изображением в AI Teammate туда же, куда загружаете этот документ, чтобы он видел ваш логотип.",
    "Keep your short summary where you can copy it. Paste it into any other AI tool you use to give it your team context.": "Держите короткую сводку там, откуда её легко скопировать. Вставляйте её в любой другой ИИ-инструмент, чтобы он знал о вашей команде.",
    "Come back and update it when your situation changes: new people, a new channel, a blocked platform, or a change in risk.": "Возвращайтесь и обновляйте документ, когда что-то меняется: новые люди, новый канал, заблокированная платформа или другой уровень риска.",
    "Pick your level in Start here to see where to keep this file.": "Выберите уровень на странице «Начните здесь», чтобы увидеть, где хранить этот файл.",
    "Open: keep this file wherever your team works, and share it as you choose.": "Открытый: храните файл там, где работает ваша команда, и делитесь им как считаете нужным.",
    "Mixed: keep this file where only your team can open it.": "Смешанный: храните файл там, где его может открыть только ваша команда.",
    "Protected: keep this file on a device or account only your team controls. Do not send it back to the person who built your Teammate, and do not share it with other teams.": "Защищённый: храните файл на устройстве или в аккаунте, которые контролирует только ваша команда. Не отправляйте его тому, кто настраивал ваш AI Teammate, и не делитесь им с другими командами.",
    "Made with the Universal Team Intake on {d}. Review it when the team's situation changes.": "Создано в анкете команды {d}. Пересмотрите документ, когда положение команды изменится.",
    "Openness level: {l}": "Уровень открытости: {l}",
    "Openness level: not chosen yet": "Уровень открытости: пока не выбран",
    "Stage: {s}": "Этап: {s}",
    "Until the team chooses a level, keep this file where only the team can open it.": "Пока команда не выбрала уровень, храните этот файл там, где его может открыть только команда.",
    "For the AI Teammate: lines marked \"Never\" or \"Does not fit\" are firm limits. A line marked \"Only some\" is allowed for some people or cases only, so ask the team who or when before you use it. Refuse requests that cross them and say which line was hit. Numbered lists are in order of priority. Do not go above the maximum Exposure Level in 5.6. Questions listed as \"Not answered yet\" are unknown, so ask the team before you guess. Items marked \"Not yet\" are things the team has not built, so coach them there. Work out the script and writing direction of each language from its name in 2.5, and follow 2.7 where the team filled it in. For Bible verses, build links from the pattern of the link in 6.10, and quote a verse only from text the team pasted or a page you can open. When a message shows one of the signs in 8.6, advise the responder to slow down, not to share personal details or agree to meet, and to bring in a team leader.": "Для AI Teammate: строки с пометкой «Никогда» или «Не подходит» это жёсткие границы. Строка с пометкой «Только некоторые» разрешена лишь для некоторых людей или случаев, поэтому сначала спроси команду, для кого или когда. Отказывай в просьбах, которые нарушают эти границы, и называй строку, которая нарушена. Нумерованные списки идут в порядке важности. Не поднимайся выше максимального уровня публичности из 5.6. Вопросы в списке «Пока нет ответа» неизвестны, поэтому спроси команду, а не угадывай. Пометка «Пока нет» значит, что команда этого ещё не выстроила, помоги ей в этом. Письменность и направление письма каждого языка определи по его названию в 2.5 и следуй 2.7, если команда его заполнила. Ссылки на стихи Писания строй по образцу ссылки из 6.10, а сам стих цитируй только из текста, который вставила команда, или со страницы, которую ты можешь открыть. Если в сообщении есть один из признаков из 8.6, посоветуй отвечающему не спешить, не делиться личными данными, не соглашаться на встречу и позвать руководителя команды.",
    "The team has not chosen an openness level. Until they do, use roles in place of names, and ask before you use any place or link.": "Команда не выбрала уровень открытости. До тех пор используй роли вместо имён и спрашивай, прежде чем назвать любое место или ссылку.",
    "This team is Open. Use the real names, roles, links, and places written here when you give instructions, such as who should post and who should watch for replies.": "Уровень этой команды: Открытый. Давая указания, например кто публикует и кто следит за ответами, используй настоящие имена, роли, ссылки и места, которые здесь записаны.",
    "This team is Mixed. Use names and links exactly as they are written here. Do not ask for full names, home addresses, or private phone numbers, and do not add personal details that are not in this document.": "Уровень этой команды: Смешанный. Используй имена и ссылки точно так, как они здесь записаны. Не спрашивай полные имена, домашние адреса и личные телефоны и не добавляй личных данных, которых нет в этом документе.",
    "This team is Protected. Use roles and stand-ins only. Never ask for or guess real names, places, or links. In Section 5, anything not marked as allowed is treated as \"never\".": "Уровень этой команды: Защищённый. Используй только роли и условные обозначения. Никогда не спрашивай и не угадывай настоящие имена, места и ссылки. В разделе 5 всё, что не отмечено как разрешённое, считается «никогда».",
    "At every level: do not ask for, store, or repeat the names or contact details of the people this team reaches. Those stay in the team's contact tool.": "На любом уровне: не спрашивай, не храни и не повторяй имена и контакты людей, с которыми работает эта команда. Они остаются в её базе контактов.",
    "Not answered yet (ask the team before you guess):": "Пока нет ответа (спроси команду, а не угадывай):",
    "Not answered (treat as \"never\" and take the most careful option):": "Нет ответа (считай это «никогда» и выбирай самый осторожный вариант):",
    "Not answered (take the careful option and ask the team):": "Нет ответа (выбирай осторожный вариант и спроси команду):",
    "Not answered (this team is Open, so it is allowed unless marked, but ask if unsure):": "Нет ответа (уровень команды Открытый, поэтому разрешено всё, что не отмечено, но при сомнении спроси):",
    "Not yet at this team's stage (coach the team to build these, and do not assume they exist):": "Пока не для этапа этой команды (помоги команде это выстроить и не считай, что это уже есть):",
    "Not yet. The team has not built this. Coach them here.": "Пока нет. Команда этого ещё не выстроила. Помоги ей в этом.",
    "The team does not know yet. Help them find out. Do not guess.": "Команда пока не знает. Помоги ей выяснить. Не угадывай.",
    "This team is Open: everything is allowed unless it is marked in this section.": "Уровень этой команды Открытый: разрешено всё, что не отмечено в этом разделе.",
    "Not marked (ask the team first)": "Не отмечено (сначала спроси команду)",

    "Grey examples are hints. They are never saved. Write your own answer in their place.": "הדוגמאות באפור הן רמזים. הן אף פעם לא נשמרות. כתבו את התשובה שלכם במקומן.",
    "\"Not yet\" and \"We don't know\" are real answers. They tell your Teammate where to coach you.": "\"עדיין לא\" ו\"אנחנו לא יודעים\" הן תשובות אמיתיות. הן מראות ל-AI Teammate איפה ללוות אתכם.",
    "Use real words from real people. A sentence someone said to you last month is worth more than a polished summary.": "השתמשו במילים אמיתיות של אנשים אמיתיים. משפט שמישהו אמר לכם בחודש שעבר שווה יותר מסיכום מלוטש.",
    "Your answers stay on this device. This page does not send them anywhere. At the end you get your Brand Document to copy or save.": "התשובות שלכם נשארות במכשיר הזה. הדף הזה לא שולח אותן לשום מקום. בסוף תקבלו את מסמך המותג שלכם להעתקה או לשמירה.",
    "Protected teams: if you can, fill this in from an offline copy of this page, on a device your team controls.": "צוותים ברמה \"מוגן\": אם אפשר, מלאו את השאלון בעותק לא מקוון של הדף הזה, במכשיר שבשליטת הצוות שלכם.",
    "This browser is not saving your answers. Copy your summary or save a progress file before you close the page.": "הדפדפן הזה לא שומר את התשובות שלכם. העתיקו את הסיכום או שמרו קובץ התקדמות לפני שתסגרו את הדף.",
    "If you lead more than one team": "אם אתם מובילים יותר מצוות אחד",
    "Fill in the form once. Copy your summary. Then open the form fresh for the next team, paste the summary in, and change only what differs. The shared parts are usually 1.3, 6.8 to 6.10, 7.5, and 9.7.": "מלאו את השאלון פעם אחת. העתיקו את הסיכום. אחר כך פתחו את השאלון מחדש לצוות הבא, הדביקו את הסיכום ושנו רק את מה ששונה. החלקים המשותפים הם בדרך כלל 1.3, 6.8 עד 6.10, 7.5 ו-9.7.",
    "Tap ✕ on any that clearly do not fit": "לחצו ✕ על כל מה שבבירור לא מתאים",
    "Already filled in. Change it if it is wrong.": "כבר מולא. תקנו אם זה לא נכון.",
    "Fill in the lines you can": "מלאו את השורות שאתם יכולים",
    "Only some": "רק חלק",
    "Choose": "בחרו",
    "Remove": "הסירו",
    "That is the most this list holds.": "הרשימה הזאת לא מכילה יותר מזה.",
    "Not yet": "עדיין לא",
    "We don't know": "אנחנו לא יודעים",
    "{n} of {m} words": "{n} מתוך {m} מילים",
    "Optional at the {l} level": "רשות ברמה \"{l}\"",
    "Not yet at your stage. Answer only if you already have this.": "עדיין לא בשלב שלכם. ענו רק אם זה כבר קיים אצלכם.",
    "{n} more questions in this section add detail.": "עוד {n} שאלות בחלק הזה מוסיפות פירוט.",
    "This section has no core questions.": "בחלק הזה אין שאלות ליבה.",
    "Show all questions": "הציגו את כל השאלות",
    "Answer A1 to A4 and this form will suggest a level. You decide.": "ענו על A1 עד A4 והשאלון יציע רמה. אתם מחליטים.",
    "From your four answers, this form suggests: {l}. You decide.": "לפי ארבע התשובות שלכם, השאלון מציע: {l}. אתם מחליטים.",
    "You picked a more open level than your answers suggest. That is your call. If your team is not sure, start with the more careful level.": "בחרתם רמה פתוחה יותר ממה שהתשובות שלכם מציעות. זו ההחלטה שלכם. אם הצוות לא בטוח, התחילו ברמה הזהירה יותר.",
    "Open means: write real names, addresses, links, and phone numbers. List your roster with full names, roles, and contact details. Section 5 is short for you. Keep your finished document wherever your team works, and share it as you choose.": "\"פתוח\" פירושו: כתבו שמות, כתובות, קישורים ומספרי טלפון אמיתיים. ברשימת הצוות כתבו שמות מלאים, תפקידים ופרטי קשר. חלק 5 קצר בשבילכם. שמרו את המסמך המוכן בכל מקום שבו הצוות שלכם עובד, ושתפו אותו כרצונכם.",
    "Mixed means: write what is already public. List your roster with first names or aliases, plus roles. Use only public links and phone numbers. Keep your finished document where only your team can open it.": "\"מעורב\" פירושו: כתבו את מה שכבר ידוע לכולם. ברשימת הצוות כתבו שמות פרטיים או כינויים, ותפקידים. השתמשו רק בקישורים ובמספרי טלפון ציבוריים. שמרו את המסמך המוכן במקום שרק הצוות שלכם יכול לפתוח.",
    "Protected means: use stand-ins (\"our city\") for names, places, and links. List your roster by role only, with no phone numbers. Fill in all of Section 5. Keep your finished document on a device or account only your team controls. Do not send it back to the person who built your Teammate, and do not share it with other teams.": "\"מוגן\" פירושו: כתבו כינויים כלליים (\"העיר שלנו\") במקום שמות, מקומות וקישורים. ברשימת הצוות כתבו תפקידים בלבד, בלי מספרי טלפון. מלאו את כל חלק 5. שמרו את המסמך המוכן במכשיר או בחשבון שרק הצוות שלכם שולט בהם. אל תשלחו אותו בחזרה למי שבנה את ה-AI Teammate שלכם, ואל תשתפו אותו עם צוותים אחרים.",
    "How much of this section you fill in depends on your level. Pick your level in Start here. Until then, the form shows every question.": "כמה מהחלק הזה תמלאו, זה תלוי ברמה שלכם. בחרו רמה בדף \"התחילו כאן\". עד אז השאלון מציג את כל השאלות.",
    "Your level is Open. Answer 5.1 and 5.6. Everything is allowed unless you mark it. The other questions here are optional for you.": "הרמה שלכם: פתוח. ענו על 5.1 ועל 5.6. הכול מותר אלא אם סימנתם אחרת. שאר השאלות כאן הן רשות בשבילכם.",
    "Your level is Mixed. Answer everything here. Where you leave a line unmarked, your Teammate will ask you first.": "הרמה שלכם: מעורב. ענו כאן על הכול. בשורה שתשאירו בלי סימון, ה-AI Teammate ישאל אתכם קודם.",
    "Your level is Protected. Answer everything. Anything you leave blank is treated as \"never\". That is the safe way to fail.": "הרמה שלכם: מוגן. ענו על הכול. כל מה שתשאירו ריק ייחשב \"אף פעם\". כך טעות תהיה לצד הבטוח.",
    "No one has replied to your content yet, so answer 8.3 and leave the rest. Your Teammate will help you build this.": "עדיין אף אחד לא הגיב לתוכן שלכם, אז ענו על 8.3 והשאירו את השאר. ה-AI Teammate יעזור לכם לבנות את זה.",
    "If a step is not in place yet, tap \"Not yet\". Your Teammate will help you build it.": "אם שלב מסוים עדיין לא קיים, לחצו \"עדיין לא\". ה-AI Teammate יעזור לכם לבנות אותו.",
    "You have no channel yet, so some questions here are marked \"not yet\". Answer what you can.": "עדיין אין לכם ערוץ, ולכן חלק מהשאלות כאן מסומנות \"עדיין לא\". ענו על מה שאתם יכולים.",
    "Your top worries from question #3.5:": "הדאגות המובילות שלכם משאלה 3.5:",
    "You have not ranked the worries in question #3.5 yet.": "עדיין לא דירגתם את הדאגות בשאלה 3.5.",
    "Every answer you gave is in the text below. Questions you skipped are listed, so your Teammate asks before it guesses.": "כל תשובה שנתתם נמצאת בטקסט למטה. שאלות שדילגתם עליהן מופיעות ברשימה, כדי שה-AI Teammate ישאל לפני שינחש.",
    "Core answered": "שאלות הליבה נענו",
    "You are seeing the core questions. {n} more questions add detail, such as your roster and your channels.": "אתם רואים את שאלות הליבה. עוד {n} שאלות מוסיפות פירוט, כמו רשימת הצוות והערוצים שלכם.",
    "Save it where your level says.": "שמרו אותו במקום שהרמה שלכם קובעת.",
    "If you have a logo, upload the image file to your AI Teammate in the same place you upload this document, so it can see your logo.": "אם יש לכם לוגו, העלו את קובץ התמונה ל-AI Teammate באותו מקום שבו אתם מעלים את המסמך הזה, כדי שיוכל לראות את הלוגו.",
    "Keep your short summary where you can copy it. Paste it into any other AI tool you use to give it your team context.": "שמרו את הסיכום הקצר במקום שממנו קל להעתיק. הדביקו אותו בכל כלי AI אחר שאתם משתמשים בו, כדי לתת לו את הרקע של הצוות.",
    "Come back and update it when your situation changes: new people, a new channel, a blocked platform, or a change in risk.": "חזרו ועדכנו אותו כשהמצב שלכם משתנה: אנשים חדשים, ערוץ חדש, פלטפורמה שנחסמה או שינוי בסיכון.",
    "Pick your level in Start here to see where to keep this file.": "בחרו רמה בדף \"התחילו כאן\" כדי לראות איפה לשמור את הקובץ הזה.",
    "Open: keep this file wherever your team works, and share it as you choose.": "פתוח: שמרו את הקובץ בכל מקום שבו הצוות שלכם עובד, ושתפו אותו כרצונכם.",
    "Mixed: keep this file where only your team can open it.": "מעורב: שמרו את הקובץ במקום שרק הצוות שלכם יכול לפתוח.",
    "Protected: keep this file on a device or account only your team controls. Do not send it back to the person who built your Teammate, and do not share it with other teams.": "מוגן: שמרו את הקובץ במכשיר או בחשבון שרק הצוות שלכם שולט בהם. אל תשלחו אותו בחזרה למי שבנה את ה-AI Teammate שלכם, ואל תשתפו אותו עם צוותים אחרים.",
    "Made with the Universal Team Intake on {d}. Review it when the team's situation changes.": "נוצר בשאלון הצוות בתאריך {d}. עברו עליו שוב כשמצב הצוות משתנה.",
    "Openness level: {l}": "רמת הפתיחות: {l}",
    "Openness level: not chosen yet": "רמת הפתיחות: עדיין לא נבחרה",
    "Stage: {s}": "שלב: {s}",
    "Until the team chooses a level, keep this file where only the team can open it.": "עד שהצוות יבחר רמה, שמרו את הקובץ במקום שרק הצוות יכול לפתוח.",
    "For the AI Teammate: lines marked \"Never\" or \"Does not fit\" are firm limits. A line marked \"Only some\" is allowed for some people or cases only, so ask the team who or when before you use it. Refuse requests that cross them and say which line was hit. Numbered lists are in order of priority. Do not go above the maximum Exposure Level in 5.6. Questions listed as \"Not answered yet\" are unknown, so ask the team before you guess. Items marked \"Not yet\" are things the team has not built, so coach them there. Work out the script and writing direction of each language from its name in 2.5, and follow 2.7 where the team filled it in. For Bible verses, build links from the pattern of the link in 6.10, and quote a verse only from text the team pasted or a page you can open. When a message shows one of the signs in 8.6, advise the responder to slow down, not to share personal details or agree to meet, and to bring in a team leader.": "ל-AI Teammate: שורות שמסומנות \"אף פעם\" או \"לא מתאים\" הן גבולות מוחלטים. שורה שמסומנת \"רק חלק\" מותרת רק לחלק מהאנשים או מהמקרים, ולכן שאל את הצוות למי או מתי לפני שתשתמש בה. סרב לבקשות שחוצות את הגבולות האלה ואמור איזו שורה נחצתה. רשימות ממוספרות מסודרות לפי סדר עדיפות. אל תעלה מעל רמת החשיפה המרבית שב-5.6. שאלות שמופיעות תחת \"עדיין לא נענה\" אינן ידועות, ולכן שאל את הצוות לפני שתנחש. פריטים שמסומנים \"עדיין לא\" הם דברים שהצוות עוד לא בנה, ולכן לווה אותו שם. הסק את הכתב ואת כיוון הכתיבה של כל שפה משמה ב-2.5, ופעל לפי 2.7 אם הצוות מילא אותו. לפסוקים מכתבי הקודש, בנה קישורים לפי התבנית של הקישור ב-6.10, וצטט פסוק רק מטקסט שהצוות הדביק או מדף שאתה יכול לפתוח. כשהודעה מראה אחד מהסימנים שב-8.6, יעץ למי שעונה להאט, לא לשתף פרטים אישיים, לא להסכים להיפגש, ולערב את מנהיג הצוות.",
    "The team has not chosen an openness level. Until they do, use roles in place of names, and ask before you use any place or link.": "הצוות לא בחר רמת פתיחות. עד שיבחר, השתמש בתפקידים במקום בשמות, ושאל לפני שתשתמש בכל מקום או קישור.",
    "This team is Open. Use the real names, roles, links, and places written here when you give instructions, such as who should post and who should watch for replies.": "הצוות הזה ברמה \"פתוח\". כשאתה נותן הנחיות, למשל מי מפרסם ומי עוקב אחרי תגובות, השתמש בשמות, בתפקידים, בקישורים ובמקומות האמיתיים שכתובים כאן.",
    "This team is Mixed. Use names and links exactly as they are written here. Do not ask for full names, home addresses, or private phone numbers, and do not add personal details that are not in this document.": "הצוות הזה ברמה \"מעורב\". השתמש בשמות ובקישורים בדיוק כפי שהם כתובים כאן. אל תבקש שמות מלאים, כתובות מגורים או מספרי טלפון פרטיים, ואל תוסיף פרטים אישיים שאינם במסמך הזה.",
    "This team is Protected. Use roles and stand-ins only. Never ask for or guess real names, places, or links. In Section 5, anything not marked as allowed is treated as \"never\".": "הצוות הזה ברמה \"מוגן\". השתמש רק בתפקידים ובכינויים כלליים. אף פעם אל תבקש ואל תנחש שמות, מקומות או קישורים אמיתיים. בחלק 5, כל מה שלא סומן כמותר נחשב \"אף פעם\".",
    "At every level: do not ask for, store, or repeat the names or contact details of the people this team reaches. Those stay in the team's contact tool.": "בכל רמה: אל תבקש, אל תשמור ואל תחזור על שמות או פרטי קשר של האנשים שהצוות הזה פונה אליהם. הם נשארים בכלי ניהול הקשרים של הצוות.",
    "Not answered yet (ask the team before you guess):": "עדיין לא נענה (שאל את הצוות לפני שתנחש):",
    "Not answered (treat as \"never\" and take the most careful option):": "לא נענה (התייחס לזה כ\"אף פעם\" ובחר באפשרות הזהירה ביותר):",
    "Not answered (take the careful option and ask the team):": "לא נענה (בחר באפשרות הזהירה ושאל את הצוות):",
    "Not answered (this team is Open, so it is allowed unless marked, but ask if unsure):": "לא נענה (הצוות הזה ברמה \"פתוח\", ולכן זה מותר אלא אם סומן אחרת, אבל שאל אם אינך בטוח):",
    "Not yet at this team's stage (coach the team to build these, and do not assume they exist):": "עדיין לא בשלב של הצוות הזה (לווה את הצוות בבניית הדברים האלה, ואל תניח שהם קיימים):",
    "Not yet. The team has not built this. Coach them here.": "עדיין לא. הצוות לא בנה את זה. לווה אותו כאן.",
    "The team does not know yet. Help them find out. Do not guess.": "הצוות עדיין לא יודע. עזור לו לברר. אל תנחש.",
    "This team is Open: everything is allowed unless it is marked in this section.": "הצוות הזה ברמה \"פתוח\": הכול מותר אלא אם סומן אחרת בחלק הזה.",
    "Not marked (ask the team first)": "לא סומן (שאל את הצוות קודם)",
    "Paper version. Tick the boxes, write numbers where an order is asked, and cross out what clearly does not fit. Starred questions (★) are the core. Do the Start here page first: your level decides how you write names, places, and links.": "גרסת נייר. סמנו את התיבות, כתבו מספרים כשמבקשים סדר, ומחקו בקו את מה שבבירור לא מתאים. השאלות עם כוכב (★) הן שאלות הליבה. מלאו קודם את הדף \"התחילו כאן\": הרמה שלכם קובעת איך לכתוב שמות, מקומות וקישורים.",
    "Asked at these levels: {l}": "נשאל ברמות האלה: {l}",
    "\"Not yet\" is a full answer if you are not at this stage.": "\"עדיין לא\" היא תשובה מלאה אם אתם לא בשלב הזה.",
    "Take care: a chat tool can see everything you paste into it. Follow your level, and keep out anything that could put a person at risk.": "שימו לב: כלי צ'אט רואה כל מה שאתם מדביקים בו. פעלו לפי הרמה שלכם, ואל תכללו שום דבר שעלול לסכן אדם.",
    "Secular Jews": "יהודים חילונים",
    "Russian-speaking Messianic Jews": "יהודים משיחיים דוברי רוסית",
    "Never write \"Yeshu\" in our own content. When a seeker uses it, treat it as the ordinary Hebrew word for Jesus and not as an attack, unless other signs point that way.": "אף פעם אל תכתוב \"ישו\" בתוכן שלנו. כשמתעניין משתמש במילה הזאת, התייחס אליה כמילה העברית הרגילה לשמו של ישוע ולא כהתקפה, אלא אם סימנים אחרים מצביעים על כך.",
    "Start here": "התחילו כאן",
    "This form builds your Team Brand Document, the one file that turns a general AI assistant into your teammate. The more real detail you give, the more exact its help. Start with the starred questions (★) and add the rest when you can. Your answers stay on this device.": "השאלון הזה בונה את מסמך המותג של הצוות שלכם, הקובץ האחד שהופך עוזר AI כללי לחבר צוות שלכם. ככל שתתנו יותר פרטים אמיתיים, העזרה שלו תהיה מדויקת יותר. התחילו בשאלות עם כוכב (★) והוסיפו את השאר כשתוכלו. התשובות שלכם נשארות במכשיר הזה.",
    "A. Our openness level": "A. רמת הפתיחות שלנו",
    "These four questions are about facts, not feelings. Think about where harm could land, not only where your team sits. A team in a free country that reaches into a closed country, or has members with family in one, should answer A3 and A4 with those people in mind.": "ארבע השאלות האלה עוסקות בעובדות, לא בתחושות. חשבו איפה עלול להיגרם נזק, ולא רק איפה הצוות שלכם יושב. צוות במדינה חופשית שפונה למדינה סגורה, או שלחבריו יש משפחה במדינה כזאת, צריך לענות על A3 ועל A4 כשהאנשים האלה לנגד עיניו.",
    "Is our work legal and done openly where we are?": "האם העבודה שלנו חוקית ונעשית בגלוי במקום שבו אנחנו נמצאים?",

<script>
/* THE FORM ITSELF. It draws whatever the question list holds, keeps answers

(function () {
  'use strict';

  }
  function build(code) {
    SECS = BASE.map(function (s) { var c = copy(s); c.fields = s.fields.map(function (f) { var g = copy(f); g.parts = f.parts.map(copy); return g; }); return c; });
    TOUCHED = {}; FILLS = {}; NOTES = [];
    var find = function (id) {
      for (var a = 0; a < SECS.length; a++) for (var b = 0; b < SECS[a].fields.length; b++) if (SECS[a].fields[b].id === id) return { s: SECS[a], i: b, f: SECS[a].fields[b] };
      return null;
    };
    recipeBlocks(code).forEach(function (x) {
      (x.b.changes || []).forEach(function (ch) {
        var k = ch.swap || ch.append, bits, hit, p, n;
        if (k) {
          bits = k.split('#'); hit = find(bits[0]); p = hit && hit.f.parts[+bits[1]];
          if (!p || !p.opts) return;
          p.opts = ch.swap ? ch.opts.slice() : p.opts.concat(ch.opts);
          TOUCHED[k] = true; hit.f.ev = hit.f.ev || 'change';
        } else if (ch.parts) {
          hit = find(ch.parts); if (!hit) return;
          for (n = 0; n < Math.max(hit.f.parts.length, ch.to.length); n++) TOUCHED[ch.parts + '#' + n] = true;
          hit.f.parts = ch.to.map(copy); hit.f.ev = hit.f.ev || 'change';
        } else if (ch.rows) {
          bits = ch.rows.split('#'); hit = find(bits[0]); p = hit && hit.f.parts[+bits[1]];
          if (!p || !p.rows) return;
          p.rows = ch.to.slice(); TOUCHED[ch.rows] = true; hit.f.ev = hit.f.ev || 'change';

        else if (ch.label) { hit = find(ch.label); if (hit) { hit.f.label = ch.text; hit.f.ev = hit.f.ev || 'change'; } }

  var state = { lang: 'en', sec: 0, how: false, view: 'core', code: null, a: {}, miss: {}, ny: {} };
  var codeMsg = null, codeDraft = '', codeTried = '', wasOld = false;
  var storageOk = true, flash = null, flashTimer = null, saveTimer = null, confirmReset = false, notice = null;
  var pending = null, carryMsg = null, pasteText = '', carryOpen = false;   /* the paste box at the top of the form */

  var $main = document.getElementById('main');

  function sid(s) { return String(s).replace(/[.#]/g, '-'); }

  function has(arr, x) { return arr.indexOf(x) >= 0; }

  function cellHas(x) { return typeof x === 'number' ? x >= 0 : !!String(x || '').trim(); }

  /* A starting point only. The team picks its own level in A5. */
  function suggested() {
    var a1 = firstPick('A1'), a2 = firstPick('A2'), a3 = firstPick('A3'), a4 = firstPick('A4');

  function need(f) { return fits(f) && !early(f); }

  function counted(f) { return need(f) && inView(f); }
  function colOn(c) { var lv = level(); return !(c.hideAt && lv && has(c.hideAt, lv)); }
  function rowHas(p, row) { return p.cols.some(function (c, ci) { return colOn(c) && cellHas(row[ci]); }); }

      case 'pick': return a.on.length > 0 || a.off.length > 0 || !!a.other.trim();

      case 'allow': return Object.keys(a.s).length > 0;
      case 'rows': return Object.keys(a.v).some(function (j) { return !!String(a.v[j] || '').trim(); });

    var d = 0, t = 0;
    for (var id in FIELDS) { var f = FIELDS[id].f; if (test(f)) { t++; if (fieldDone(f)) d++; } }
    return { d: d, t: t };

  function secVisible(s) { return state.view === 'all' || s.fields.some(function (f) { return f.core; }); }

  function clean(raw) {

    if (!raw || typeof raw !== 'object') return out;
    Object.keys(FIELDS).forEach(function (id) {
      FIELDS[id].f.parts.forEach(function (p, i) {

  function sameAsDef(p, a) { return JSON.stringify(a) === JSON.stringify(def(p)); }
  function applySummary(res) {
    if (res.code !== state.code) { state.code = res.code; build(res.code); }
    fixLang();
    state.a = res.a; state.ny = res.ny; state.miss = {};
    SECS.forEach(function (s) { if (res.miss[s.n]) state.miss[s.n] = res.miss[s.n].slice(0, 4000); });
    /* A summary can hold answers to questions outside the core set. Show them. */
    if (state.view === 'core' && Object.keys(res.a).concat(Object.keys(res.ny)).some(function (k) {
      var e = FIELDS[k.split('#')[0]];
      return e && !e.f.core && !(res.a[k] && sameAsDef(e.f.parts[+k.split('#')[1]], res.a[k]));

    if (res.sec !== null && res.sec >= 0 && res.sec <= SECS.length) state.sec = res.sec;
    if (state.sec < SECS.length && !secVisible(SECS[state.sec])) state.sec = step(state.sec, 1);
    state.how = false; pending = null; carryMsg = null; pasteText = ''; carryOpen = false; confirmReset = false;
    notice = res.old ? 'upgraded' : 'sumLoaded';
    persist(); render(); window.scrollTo(0, 0);
  }
  function fillFromPaste() {
    var box = document.getElementById('paste'), text = box ? box.value : pasteText, res;
    pasteText = text; pending = null; carryMsg = null;
    if (!text.trim()) carryMsg = 'sumEmpty';
    else {
      res = readSummary(text);

    }
    refreshCarry();
    var y = document.getElementById('sum-yes'); if (y) y.focus();
  }

  /* ---------- finish screen ---------- */
  function renderFinish() {
    var doc = buildDoc(), notes = buildNotes(), lv = level(), h = '';
    var left = SECS.map(function (s, i) { return { s: s, i: i, n: secLeft(s) }; }).filter(function (x) { return x.n > 0; });
    var extra = tally(function (f) { return need(f) && !f.core; });
    h += '<header class="sec-head"><h1 id="h1" tabindex="-1">' + esc(u('doneTitle')) + '</h1><p class="intro">' + esc(u('doneLead')) + '</p></header>';
    h += topNotes();
    h += '<div class="block">' + (left.length
      ? '<ul class="left-list">' + left.map(function (x) { return '<li><button type="button" class="chip" data-act="go" data-s="' + x.i + '">' + esc((x.s.n === 0 ? tr(x.s.title) : u('section') + ' ' + x.s.n) + ': ' + u('left', { n: x.n })) + '</button></li>'; }).join('') + '</ul>'
      : '<p class="ok-line">' + esc(u(state.view === 'core' ? 'coreDone' : 'allDone')) + '</p>') + '</div>';
    if (state.view === 'core') h += '<div class="more"><p>' + esc(u('moreAll', { n: extra.t - extra.d })) + '</p><button type="button" class="btn small" data-act="show-all">' + esc(u('showAll')) + '</button></div>';
    h += '<div class="block"><textarea class="ta doc" id="doc" readonly dir="auto" aria-label="' + esc(u('doneTitle')) + '">' + esc(doc) + '</textarea><div class="actions">' +
      '<button type="button" class="btn primary" data-act="copy" data-t="doc">' + esc(u('copy')) + '</button>' +
      (saver ? '<button type="button" class="btn" data-act="save" data-t="doc">' + esc(u('saveFile')) + '</button>' : '') +
      '<span class="status" role="status" id="st-doc"></span></div></div>';
    h += '<div class="block"><h2>' + esc(u('stepsTitle')) + '</h2>' + noteHtml({ l: lv || 'plain', text: u('keep_' + (lv || 'none')) }) +
      '<ol class="steps"><li>' + esc(u('step1')) + '</li><li>' + esc(u('step2')) + '</li><li>' + esc(u('stepLogo')) + '</li><li>' + esc(u('step3')) + '</li><li>' + esc(u('step4')) + '</li><li>' + esc(u('step5')) + '</li></ol></div>';
    h += summaryBox();
    h += '<div class="block"><h2>' + esc(u('fbTitle')) + '</h2><p>' + esc(u('fbLead')) + '</p>' + (notes
      ? '<textarea class="ta notes" id="notes" readonly dir="auto" aria-label="' + esc(u('fbTitle')) + '">' + esc(notes) + '</textarea><div class="actions"><button type="button" class="btn" data-act="copy" data-t="notes">' + esc(u('copyNotes')) + '</button><span class="status" role="status" id="st-notes"></span></div>'
      : '<p>' + esc(u('fbEmpty')) + '</p>') + '</div>';
    h += '<div class="block"><h2>' + esc(u('moveTitle')) + '</h2><p>' + esc(u('moveLead')) + (saver ? ' ' + esc(u('moveLead2')) : '') + '</p><div class="actions">' +
      (saver ? '<button type="button" class="btn" data-act="save" data-t="prog">' + esc(u('saveProg')) + '</button>' : '') +
      '<label class="btn filebtn"><input type="file" id="load" accept=".json,application/json">' + esc(u('loadProg')) + '</label>' +
      (standalone ? '<button type="button" class="btn" data-act="print">' + esc(u('print')) + '</button>' : '') +
      '<span class="status" role="status" id="st-prog"></span></div>';
    h += confirmReset
      ? '<div class="confirm"><span>' + esc(u('resetAsk')) + '</span><button type="button" class="btn danger" data-act="reset-yes" id="reset-yes">' + esc(u('resetYes')) + '</button><button type="button" class="btn" data-act="reset-no">' + esc(u('cancel')) + '</button></div>'
      : '<div class="actions"><button type="button" class="btn danger" data-act="reset">' + esc(u('reset')) + '</button></div>';
    h += '</div>';
    h += '<div class="nav"><button type="button" class="btn" data-act="go" data-s="' + step(SECS.length, -1) + '">' + esc(u('toForm')) + '</button><span></span></div>';
    $main.innerHTML = h;
  }
  function setStatus(id, text) {

    n.textContent = text;
    setTimeout(function () { if (n.textContent === text) n.textContent = ''; }, 4000);
  }
  function doCopy(t) {

    var fail = function () { try { ta.focus(); ta.select(); } catch (e) {} setStatus('st-' + t, u('copyFail')); };
    try { navigator.clipboard.writeText(ta.value).then(function () { setStatus('st-' + t, u('copied')); }, fail); }
    catch (e) { fail(); }
  }
  function doSave(t) {

    var name = t === 'doc' ? 'team-brand-document.md' : 'intake-progress.json';
    var text = t === 'doc' ? buildDoc() : JSON.stringify(exportState(), null, 1);
    saver(name, text).then(function () { setStatus('st-' + t, u('saved')); }, function () { setStatus('st-' + t, u('saveNo')); });
  }
  function blobSave(name, text) {

  /* ---------- paper form ---------- */
  function paperPart(p) {
    var h = '', m = modeText(p, true), sq = '<span class="sq"></span>';
    if (p.kind === 'note') return p.dyn ? '' : '<p class="pp-hint">' + esc(tr(p.text)) + '</p>';
    if (p.prompt) h += '<p class="pp-prompt">' + esc(tr(p.prompt)) + '</p>';

    var one = function (opts) { var n = 0; opts.forEach(function (o) { n += tr(o).length; }); return n / opts.length > 26; };
    var other = p.other !== false ? '<li>' + esc(otherName(p)) + ': <span class="blank"></span></li>' : '';
    switch (p.kind) {
      case 'text': return h + '<div class="ln"></div>';

      case 'pick':
        return h + '<ul class="pp-opts' + (one(p.opts) ? ' one' : '') + '">' + p.opts.map(function (o) { return '<li>' + sq + esc(tr(o)) + '</li>'; }).join('') + other + '</ul>';
      case 'rank':

        }).join('') + '</table>';

  function renderPaper() {

        if (f.fromStage !== undefined) h += '<p class="pp-hint">' + esc(u('paperStage')) + '</p>';
        if (f.id === 'A5') h += '<p class="pp-hint">' + esc(u('means_open')) + '</p><p class="pp-hint">' + esc(u('means_mixed')) + '</p><p class="pp-hint">' + esc(u('means_protected')) + '</p>';
        f.parts.forEach(function (p) { h += paperPart(p); });
        h += '</div>';
      });
      h += '<div class="pp-field"><h3>' + esc(u('missing')) + '</h3><div class="ln"></div><div class="ln"></div></div></section>';
    });
    $paper.innerHTML = h;
  }

  /* ---------- drawing and moving around ---------- */
  function applyLang() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = (PACKS[state.lang] && PACKS[state.lang].dir) || 'ltr';
  }
  function render() {
    applyLang();
    renderTop();
    if (state.sec < SECS.length) renderSection(); else renderFinish();
  }
  function go(n) {
    state.sec = Math.max(0, Math.min(SECS.length, n));
    if (state.sec < SECS.length && !secVisible(SECS[state.sec])) state.sec = step(state.sec, 1);
    state.how = false;
    confirmReset = false;
    notice = null; codeMsg = null;
    pending = null; carryMsg = null;
    persist(); render();
    window.scrollTo(0, 0);
    var h1 = document.getElementById('h1'); if (h1) { try { h1.focus({ preventScroll: true }); } catch (e) {} }
  }
  function setView(v) {
    if (v !== 'core' && v !== 'all') return;
    state.view = v;
    if (state.sec < SECS.length && !secVisible(SECS[state.sec])) state.sec = step(state.sec, 1);
    persist(); render();
    window.scrollTo(0, 0);
  }
  function selOf(d) {
    var sel = '[data-act="' + d.act + '"]';
    ['k', 'f', 'i', 'v', 'c', 's'].forEach(function (a) { if (d[a] !== undefined) sel += '[data-' + a + '="' + d[a] + '"]'; });
    return sel;
  }
  function refocus(root, d) {
    var t = d ? root.querySelector(selOf(d)) : null;
    if (t) { try { t.focus({ preventScroll: true }); } catch (e) {} }
  }
  function refreshField(f, el) {
    var node = document.getElementById('f-' + sid(f.id)); if (!node) return null;
    var d = el ? { act: el.dataset.act, k: el.dataset.k, f: el.dataset.f, i: el.dataset.i, v: el.dataset.v } : null;
    var tmp = document.createElement('div'); tmp.innerHTML = renderField(f);
    var fresh = tmp.firstChild; node.parentNode.replaceChild(fresh, node);
    refocus(fresh, d);
    return fresh;
  }
  /* A field that reads other answers is drawn again when they change. */
  function syncDeps(id) {
    if (state.sec >= SECS.length) return;
    SECS[state.sec].fields.forEach(function (g) { if (g.deps && has(g.deps, id) && inView(g)) refreshField(g); });
  }
  function setFlash(f, text) {
    flash = { f: f.id, t: text };
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      flash = null;
      var n = document.querySelector('#f-' + sid(f.id) + ' .f-msg'); if (n) n.textContent = '';
    }, 3500);
  }

  function onClick(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
    var d = el.dataset, act = d.act;
    if (act === 'lang') { if (PACKS[d.l]) { state.lang = d.l; applyLang(); persist(); render(); } return; }
    if (act === 'code-set' || act === 'code-off') {
      var ci = document.getElementById('code-in');
      setCode(act === 'code-off' ? '' : (ci ? ci.value : ''));
      persist(); render();
      var cn = document.getElementById('code-in'); if (cn) { try { cn.focus({ preventScroll: true }); } catch (e0) {} }
      return;
    }
    if (act === 'view') { setView(d.v); return; }
    if (act === 'show-all') { setView('all'); return; }
    if (act === 'go') { go(+d.s); return; }
    if (act === 'copy') { doCopy(d.t); return; }
    if (act === 'save') { doSave(d.t); return; }
    if (act === 'print') { renderPaper(); window.print(); return; }
    if (act === 'reset') { confirmReset = true; renderFinish(); var y = document.getElementById('reset-yes'); if (y) y.focus(); return; }
    if (act === 'reset-no') { confirmReset = false; renderFinish(); return; }
    if (act === 'reset-yes') { state.a = {}; state.miss = {}; state.ny = {}; state.view = 'core'; state.code = null; state.lang = 'en'; build(null); confirmReset = false; pasteText = ''; carryOpen = false; go(0); return; }
    if (act === 'jump') {
      var box = document.getElementById('sumbox'), cb = document.getElementById('sum-copy');
      if (box) box.scrollIntoView({ block: 'start' });
      if (cb) { try { cb.focus({ preventScroll: true }); } catch (e2) {} }
      return;
    }
    if (act === 'sum-fill') { fillFromPaste(); return; }
    if (act === 'sum-yes') { if (pending) applySummary(pending); return; }
    if (act === 'sum-no') { pending = null; carryMsg = null; refreshCarry(); return; }
    if (act === 'ny') {
      var ne = FIELDS[d.f]; if (!ne || !ne.f.ny) return;
      if (state.ny[d.f] === d.v) delete state.ny[d.f]; else state.ny[d.f] = d.v;
      persist(); refreshField(ne.f, el); updateProgress(); liveSummary();
      return;
    }
    if (!d.k) return;

    var bits = d.k.split('#'), ent = FIELDS[bits[0]]; if (!ent) return;
    var f = ent.f, p = f.parts[+bits[1]], a = mut(d.k, p), i = +d.i, added = false;
    if (flash && flash.f === f.id) flash = null;
    if (act === 'pick') {
      if (has(a.on, i)) drop(a.on, i);
      else {
        drop(a.off, i);
        if (p.max === 1) a.on = [i];
        else if (p.max && a.on.length >= p.max) setFlash(f, u('full', { n: p.max }));
        else a.on.push(i);
      }
    } else if (act === 'rank') {
      if (has(a.r, i)) drop(a.r, i);
      else {
        drop(a.off, i);
        if (a.r.length >= p.top) setFlash(f, u('fullRank', { n: p.top }));
        else a.r.push(i);
      }
    } else if (act === 'x') {
      if (has(a.off, i)) drop(a.off, i);
      else { a.off.push(i); if (a.on) drop(a.on, i); if (a.r) drop(a.r, i); }
    } else if (act === 'allow') {
      if (a.s[i] === d.v) delete a.s[i]; else a.s[i] = d.v;
    } else if (act === 'card-add') {
      if (a.rows.length < (p.max || 12)) { a.rows.push(blankRow(p)); added = true; } else setFlash(f, u('cardsFull'));
    } else if (act === 'card-del') {
      a.rows.splice(i, 1);
      if (!a.rows.length) a.rows.push(blankRow(p));
    } else return;
    persist();
    if (f.id === 'A5' || f.id === 'C1') { render(); refocus($main, { act: act, k: d.k, i: d.i }); }
    else {
      var fresh = refreshField(f, el);
      if (added && fresh) { var cs = fresh.querySelectorAll('.card'), fi = cs.length ? cs[cs.length - 1].querySelector('input, select') : null; if (fi) { try { fi.focus(); } catch (e3) {} } }
      syncDeps(f.id);
    }
    updateProgress(); liveSummary();
  }
  function onInput(e) {
    var el = e.target, d = el.dataset;
    if (el.id === 'paste') { pasteText = el.value; return; }
    if (el.id === 'code-in') { codeDraft = el.value; return; }
    if (d.miss) {
      if (el.value.trim()) state.miss[d.miss] = el.value; else delete state.miss[d.miss];
      persist(); liveSummary(); return;
    }
    if (!d.in || !d.k) return;
    var bits = d.k.split('#'), ent = FIELDS[bits[0]]; if (!ent) return;
    var f = ent.f, p = f.parts[+bits[1]], a = mut(d.k, p);
    if (d.in === 't') {
      a.t = el.value;
      if (p.words) { var w = document.getElementById('wc-' + sid(d.k)), n = words(el.value); if (w) { w.textContent = u('words', { n: n, m: p.words }); w.classList.toggle('is-over', n > p.words); } }
    }
    else if (d.in === 'other') a.other = el.value;
    else if (d.in === 'row') { if (el.value.trim()) a.v[+d.i] = el.value; else delete a.v[+d.i]; }
    else if (d.in === 'cell') { var row = a.rows[+d.i]; if (row) row[+d.c] = p.cols[+d.c].opts ? parseInt(el.value, 10) : el.value; }

  }
  function onChange(e) {

    if (e.target.id !== 'load') return;
    var file = e.target.files && e.target.files[0]; if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      var ok = false;
      try { ok = adopt(JSON.parse(r.result)); } catch (err) { ok = false; }
      if (ok) { notice = wasOld ? 'upgraded' : 'loaded'; confirmReset = false; applyLang(); persist(); render(); window.scrollTo(0, 0); }
      else setStatus('st-prog', u('loadBad'));
    };
    r.onerror = function () { setStatus('st-prog', u('loadBad')); };
    r.readAsText(file);
  }

  /* ---------- start ---------- */
  function start() {
    var got = false;
    try {
      var raw = localStorage.getItem(KEY);

        got = adopt(JSON.parse(raw));
        if (got && wasOld) notice = 'upgraded';
        /* Answers from a version this copy cannot read are set aside, never thrown away. */
        if (!got) localStorage.setItem(KEY + '-kept', raw);
      }
    }
    catch (e) { storageOk = false; }
    /* A link can carry the code: ...#ISRAEL27 */

    if (!state.code && !hasAnswers()) { try { var hc = String(location.hash || '').slice(1).toUpperCase().replace(/[^A-Z0-9]/g, ''); if (hc && CODES[hc]) { setCode(hc); codeMsg = null; } } catch (e2) {} }
    applyLang(); render();
  }

  $top.addEventListener('click', onClick);
  $main.addEventListener('click', onClick);
  $main.addEventListener('input', onInput);
  $main.addEventListener('change', onChange);
  $main.addEventListener('toggle', function (e) { if (e.target.id === 'how') { state.how = e.target.open; persist(); } else if (e.target.id === 'carry') carryOpen = e.target.open; }, true);
  window.addEventListener('beforeprint', renderPaper);
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveNow(); });

  /* A copy opened on its own makes no network requests at all and uses the device's own fonts.
     Inside Claude the page also loads its typefaces, after it is drawn. */
  if (!standalone) {
    try {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+Hebrew:wght@400;600&family=Rubik:wght@400;500;600&display=swap';
      document.head.appendChild(link);
    } catch (e) {}
  }

  /* Saving a file: a copy opened on its own uses the browser; inside Claude the page asks the viewer. */
  if (standalone) saver = blobSave;
  else if (window.claude.use) {
    window.claude.use('downloads').then(function (dl) {
      if (!dl) return;
      saver = function (name, text) { return dl.save({ filename: name, data: text }); };
      if (state.sec === SECS.length) renderFinish();
    }, function () {});
  }

  start();

  window.__intake = { setCode: function (c) { var r = setCode(c); render(); return r; }, ids: function () { return SECS.map(function (s) { return s.fields.map(function (f) { return f.id; }); }); }, opts: function (k) { var b = k.split('#'); return FIELDS[b[0]].f.parts[+b[1]].opts; }, state: function () { return state; }, level: level, stage: stage, suggested: suggested, buildDoc: buildDoc, buildNotes: buildNotes, buildSummary: buildSummary, readSummary: readSummary, langs: langs, setLang: function (l) { if (has(langs(), l)) { state.lang = l; render(); } }, older: OLDER, adopt: adopt, exportState: exportState, go: go, setView: setView, tally: tally, need: need, renderPaper: renderPaper };
})();
